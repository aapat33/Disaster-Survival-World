<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>DISASTER SURVIVAL 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23070b12'/%3E%3Ctext y='72' x='50' font-size='62' text-anchor='middle'%3E%E2%98%A2%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js" } }
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- ================= AUTH ================= -->
<div id="auth" class="overlay">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">☢</div>
      <h1>DISASTER<span>SURVIVAL</span></h1>
      <p class="tagline">Survive the round. Outlive everyone else.</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="login">Sign In</button>
      <button class="tab" data-mode="register">Create Account</button>
    </div>

    <form id="auth-form" autocomplete="off">
      <label>Username
        <input id="username" name="username" maxlength="16" placeholder="Survivor_01" required />
      </label>
      <label>Password
        <input id="password" name="password" type="password" maxlength="64" placeholder="••••••••" required />
      </label>
      <p id="auth-error" class="error"></p>
      <button type="submit" id="auth-submit" class="btn primary">Enter the Arena</button>
    </form>

    <button id="guest-btn" class="btn ghost">Play as Guest</button>
    <p class="fineprint">Accounts are stored on this server (scrypt hashed). No Firebase, no third parties.</p>
  </div>
</div>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <header id="topbar">
    <div class="pill" id="map-pill"><span class="label">MAP</span><b id="map-name">—</b></div>
    <div class="center-stack">
      <div id="phase-label">INTERMISSION</div>
      <div id="timer">20</div>
      <div id="disaster-badge" class="badge">
        <span id="disaster-name">—</span>
        <span id="disaster-difficulty">—</span>
      </div>
    </div>
    <div class="pill right"><span class="label">ALIVE</span><b id="alive-count">0</b><span id="player-count" class="muted">/0</span></div>
  </header>

  <div id="hint-bar"></div>
  <div id="feed"></div>

  <aside id="chat">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="140" placeholder="Press Enter to chat…" autocomplete="off" />
      <button type="submit" aria-label="Send">↵</button>
    </form>
  </aside>

  <div id="controls">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>Shift</kbd> sprint</span>
    <span><kbd>Drag</kbd> look</span>
  </div>

  <div id="death-overlay" class="hidden">
    <div class="death-card">
      <div class="skull">💀</div>
      <h2>ELIMINATED</h2>
      <p id="death-cause">—</p>
      <p class="muted">Spectating until the round ends…</p>
    </div>
  </div>

  <div id="results-overlay" class="hidden">
    <div class="results-card">
      <h2 id="results-title">ROUND OVER</h2>
      <p id="results-sub" class="muted"></p>
      <div id="results-list"></div>
      <p class="next-up" id="results-next"></p>
    </div>
  </div>
</div>

<div id="fx-tint"></div>
<div id="fx-flash"></div>
<div id="vignette"></div>
<div id="boot-error" class="hidden"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
